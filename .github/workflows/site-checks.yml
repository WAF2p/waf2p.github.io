name: Site checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Node dependencies
        run: npm ci

      - name: Verify provider data export is current
        run: |
          node scripts/generate-provider-data.mjs
          git diff --exit-code assets/data/providers.json assets/data/providers.csv

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check local links
        run: node scripts/check-links.mjs

      - name: Check rendered HTML
        run: node scripts/check-html.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against the built site
        run: |
          python3 -m http.server 4000 -d _site >/tmp/site-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node tests/site-smoke.mjs
