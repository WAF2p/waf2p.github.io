# Recompute contributor ranks + static badges once a week and open a PR.
#
# The workflow never pushes to `main`. It pushes a single bot branch and opens
# (or updates) a pull request for review. The committed data is what the normal
# Jekyll build deploys, so no separate publish step is needed.
#
# Optional: add a SLACK_WEBHOOK_URL secret to be notified when a rank changes.
# Repo setting: Settings → Actions → General → "Allow GitHub Actions to create
# and approve pull requests" must be enabled for the PR step.
name: Refresh contributor ranks

on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributor-ranks
  cancel-in-progress: false

jobs:
  ranks:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Recompute ranks and badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ranks.mjs --verbose

      - name: Count rank changes
        id: promotions
        run: |
          count=$(node -e "const {load}=require('js-yaml');const fs=require('fs');const p=load(fs.readFileSync('_data/community_promotions.yml','utf8'))||[];process.stdout.write(String(p.length))")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about promotions
        if: steps.promotions.outputs.count != '0' && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Wombat contributor ranks: ${{ steps.promotions.outputs.count }} rank change(s) ready for review in the bot PR.\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to bot branch and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B bot/contributor-ranks
          git add _data/contributor_ranks.json _data/community_promotions.yml assets/data/contributor-ranks.json badges
          git commit -m "chore(contributors): refresh ranks and badges"
          git push --force origin bot/contributor-ranks

          existing=$(gh pr list --head bot/contributor-ranks --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Updated existing PR #$existing."
          else
            body=$(printf '%s\n' \
              'Automated weekly contributor-rank refresh.' \
              '' \
              'Generated by `scripts/ranks.mjs` from the committed contributor cache and curated YAML. Review the data and badges before merging.' \
              '' \
              '- `_data/contributor_ranks.json`' \
              '- `assets/data/contributor-ranks.json`' \
              '- `badges/*.svg`' \
              '- `_data/community_promotions.yml` (rank changes only)' \
              '' \
              'This workflow never pushes to `main` directly.')
            gh pr create \
              --base main \
              --head bot/contributor-ranks \
              --title "chore(contributors): refresh ranks and badges" \
              --body "$body"
          fi
