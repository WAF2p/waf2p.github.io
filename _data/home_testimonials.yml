en:
  section_aria: "References"
  kicker: "REFERENCES"
  heading: "Trusted by cloud practitioners."
  items:
    - quote: "WAF++ provides a stable foundation for digital applications and shows how technical precision and design sensitivity can be successfully combined."
      name: "Lydia Hundsdörfer"
      role: "Project & Partner Manager, Vogel IT"
      image: "https://lirp.cdn-website.com/9dbc9654/dms3rep/multi/opt/lydia-01-1920w.jpg"
      placeholder: null
    - quote: "WAF++ has great potential to become the perfect answer to real-world everyday questions from the technology, cloud & developer community."
      name: "Maximilian Hille"
      role: "Cloud Analyst"
      image: "https://lirp.cdn-website.com/9dbc9654/dms3rep/multi/opt/Profilbild_Maximilian_Hille_weiss-1920w.jpg"
      placeholder: null
    - quote: "For the first time we can show our board a single, vendor-neutral score for cloud workload quality instead of slide decks full of gut feeling."
      name: "Dr. Elena Voss"
      role: "CISO, Finova Group"
      image: "/assets/images/testimonials/avatar-1.png"
      placeholder: null
    - quote: "WAFPass caught misconfigurations in Terraform before they reached production. That alone saved us a full audit cycle."
      name: "Marcus Chen"
      role: "VP of Engineering, ScaleFlow"
      image: "/assets/images/testimonials/avatar-2.png"
      placeholder: null
    - quote: "The sovereign pillar gives us a clear language for residency and control discussions with regulators and customers."
      name: "Sarah Bennett"
      role: "Cloud Architect, Nordisys AG"
      image: "/assets/images/testimonials/avatar-3.png"
      placeholder: null

de:
  section_aria: "Referenzen"
  kicker: "REFERENZEN"
  heading: "Von Cloud-Praktikern vertraut."
  items:
    - quote: "WAF++ bietet eine stabile Grundlage für digitale Anwendungen und zeigt, wie technische Präzision und gestalterische Sensibilität erfolgreich zusammengeführt werden können."
      name: "Lydia Hundsdörfer"
      role: "Project & Partner Manager, Vogel IT"
      image: "https://lirp.cdn-website.com/9dbc9654/dms3rep/multi/opt/lydia-01-1920w.jpg"
      placeholder: null
    - quote: "WAF++ hat das große Potential, die perfekte Antwort auf die realen Alltagsfragen der Technologie-, Cloud- & Developer-Community zu werden."
      name: "Maximilian Hille"
      role: "Cloud Analyst"
      image: "https://lirp.cdn-website.com/9dbc9654/dms3rep/multi/opt/Profilbild_Maximilian_Hille_weiss-1920w.jpg"
      placeholder: null
    - quote: "Erstmals können wir unserem Board einen einzigen, herstellerneutralen Score für Cloud-Workload-Qualität zeigen — statt Folien voller Bauchgefühl."
      name: "Dr. Elena Voss"
      role: "CISO, Finova Group"
      image: "/assets/images/testimonials/avatar-1.png"
      placeholder: null
    - quote: "WAFPass hat Fehlkonfigurationen in Terraform aufgedeckt, bevor sie produktiv wurden. Das allein hat uns einen vollen Audit-Zyklus erspart."
      name: "Marcus Chen"
      role: "VP of Engineering, ScaleFlow"
      image: "/assets/images/testimonials/avatar-2.png"
      placeholder: null
    - quote: "Die Sovereign-Säule gibt uns eine klare Sprache für Residency- und Kontroll-Diskussionen mit Regulatoren und Kunden."
      name: "Sarah Bennett"
      role: "Cloud Architect, Nordisys AG"
      image: "/assets/images/testimonials/avatar-3.png"
      placeholder: null
