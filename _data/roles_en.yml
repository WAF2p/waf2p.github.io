# Roles & mapping (data-driven)
# - id: technical identifier (for anchor links)
# - title: display name of the role
# - description: short description text
# - members: list of staff member slugs (typically matches the folder name under /staff_members/<slug>/)
#
# Example:
# members:
#   - sascha-lewandowski
#   - max-muster

- id: tsc
  title: Technical Steering Committee (TSC)
  description: Responsible for technical direction, RFC decisions, and architecture guidance.
  members:
    - artem
    - sascha
    - sebastian
    - tim

- id: maintainers
  title: Maintainers
  description: Maintain the central repositories, perform reviews, and ensure quality & consistency.
  members: []

- id: wg-leads
  title: Working Group Leads
  description: Coordinate working groups (charter, scope, meetings) and feed results back into the repos.
  members: []

- id: user-advisory
  title: User Advisory Group
  description: Brings perspectives from projects, operations, and audits and helps with prioritization & practical relevance.
  members: []

- id: contributors
  title: Contributors
  description: File issues/PRs, provide feedback, and help with docs, translations, and reviews.
  members: []
