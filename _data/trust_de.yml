# Trust Center (Deutsch) — öffentliche Zusammenfassung von Lizenzen,
# Sicherheitsprozess, Governance, Datenhaltung und Release-Transparenz.
# Keine Zertifizierung.

last_reviewed: "2026-10-31"
intro: "Wombat ist ein Open-Source-Framework mit einem öffentlichen Governance-Prozess. Diese Seite bündelt die Fakten, die Sicherheitsprüfer, Beschaffungsteams und Partner üblicherweise anfragen — und zeigt, wo jede Aussage überprüfbar ist."
disclaimer: "Diese Seite ist eine Zusammenfassung öffentlicher Zusagen. Sie ist keine Zertifizierung, kein Auditurteil und keine Rechtsberatung. Maßgeblich sind die Dateien im Repository, die Lizenzen und die offizielle Projektdokumentation."

sections:
  - title: "Open Source, klare Lizenzen"
    summary: "Code und Dokumentation nutzen Standard-Open-Source-Lizenzen; die Dateien im Repository sind maßgeblich."
    facts:
      - "Code: Apache License 2.0"
      - "Dokumentation: CC BY 4.0"
      - "Maßgebliche Dateien: LICENSE / NOTICE im Repository und die Hinweise auf /de/legal/"
    links:
      - label: "Rechtliche Hinweise"
        url: "/de/legal/"
      - label: "Framework-Repository"
        url: "https://github.com/waf2p/framework"

  - title: "Sicherheit und Responsible Disclosure"
    summary: "Sicherheitsprobleme werden vertraulich gemeldet und koordiniert veröffentlicht. Für Schwachstellen bitte kein öffentliches Issue anlegen."
    facts:
      - "Das Framework-Repository enthält eine SECURITY.md."
      - "Nutze GitHubs privates Vulnerability-Reporting bzw. den Security-Advisory-Prozess."
      - "Koordinierte Offenlegung ist der Standard; es besteht kein Bug-Bounty-Anspruch."
    links:
      - label: "Security Policy"
        url: "https://github.com/waf2p/framework/security/policy"
      - label: "Schwachstelle melden"
        url: "https://github.com/waf2p/framework/security/advisories/new"
      - label: "security.txt"
        url: "/.well-known/security.txt"

  - title: "Governance und Entscheidungen"
    summary: "Wesentliche Änderungen durchlaufen einen öffentlichen RFC-Prozess. Rollen, Amtszeiten und Entscheidungsregeln sind dokumentiert."
    facts:
      - "RFC-getriebene Entscheidungen mit öffentlicher Diskussion"
      - "TSC, Working Groups und Mitwirkenden-Rollen"
      - "Der Code of Conduct gilt für alle Projektflächen"
    links:
      - label: "Governance & Community"
        url: "/de/governance-community/"
      - label: "RFC-Tracker"
        url: "/de/rfc/"
      - label: "Code of Conduct"
        url: "/de/code-of-conduct/"
      - label: "Rollen & Mitglieder"
        url: "/de/roles/"

  - title: "Datenhaltung auf dieser Website"
    summary: "Die Marketing-Website ist statisch. Die Scorecard läuft im Browser. Wir laden deine Bewertung nicht auf einen Wombat-Server."
    facts:
      - "Keine serverseitige Datenbank speichert Bewertungsergebnisse."
      - "Die Scorecard liest dein JSON lokal und rendert die Karte im Browser."
      - "Die Newsletter-Anmeldung läuft über den konfigurierten E-Mail-Provider, nicht über einen Wombat-Anwendungsserver."
      - "Das Rang-System veröffentlicht nur einen öffentlichen GitHub-Login und den berechneten Rang."
    links:
      - label: "Scorecard"
        url: "/de/wombatpass/scorecard/"
      - label: "Mitwirkenden-Ränge (EN)"
        url: "/contributors/ranks/"
      - label: "Newsletter"
        url: "/de/newsletter/"

  - title: "Release-Transparenz"
    summary: "Releases, Änderungen und die Roadmap sind öffentlich. Die Dokumentation ist zusammen mit dem Framework versioniert."
    facts:
      - "Öffentlicher Changelog mit versionierten Einträgen"
      - "Öffentliche Roadmap und RFC-Tracker"
      - "Versionierte Antora-Dokumentation"
    links:
      - label: "Changelog"
        url: "/de/changelog/"
      - label: "Roadmap"
        url: "/de/roadmap/"
      - label: "Dokumentation"
        url: "/docs/"

  - title: "Mitmachen und Verhalten"
    summary: "Beitragsregeln, Review-Erwartungen und Community-Verhalten sind im Repository und auf der Website dokumentiert."
    facts:
      - "CONTRIBUTING.md im Framework-Repository"
      - "CODE_OF_CONDUCT.md im Framework-Repository"
      - "Good-First-Issues und öffentliche Diskussionen"
    links:
      - label: "Mitmachen"
        url: "/de/contributing/"
      - label: "Good First Issues"
        url: "https://github.com/waf2p/framework/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22"
      - label: "Diskussionen"
        url: "https://github.com/waf2p/framework/discussions"

verification:
  title: "Wie du die Aussagen auf dieser Seite prüfst"
  text: "Jeder Punkt oben verlinkt auf eine öffentliche Quelle. Wenn eine Aussage nicht aus dem Repository, den Lizenzen oder der öffentlichen Dokumentation überprüfbar ist, behandle sie als Frage an die Maintainer — nicht als Zusage."
  checklist:
    - "Lies LICENSE, NOTICE und SECURITY.md im Framework-Repository."
    - "Prüfe RFC-Tracker und Governance-Seite für die Entscheidungshistorie."
    - "Lies die versionierte Dokumentation für Controls und ihre Evidenzerwartungen."
    - "Nutze den öffentlichen Issue-Tracker oder die Diskussionen für alles, was nicht dokumentiert ist."

cta:
  title: "Brauchst du ein Sicherheits- oder Beschaffungsgespräch?"
  text: "Starte mit den öffentlichen Quellen und bringe die konkrete Frage in die Community. Die Governance-Seite erklärt die Kanäle."
  primary_label: "Governance & Community"
  primary_url: "/de/governance-community/"
  secondary_label: "Compliance-Hubs öffnen"
  secondary_url: "/de/compliance/"
