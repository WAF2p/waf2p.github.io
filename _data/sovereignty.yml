# Sovereignty hub — the editorial frame for the Sovereign pillar and the
# compliance/trust pages. Keep claims technical and verifiable; sovereignty
# is not the same as data residency.

title: "Sovereignty"
kicker: "Control, not just location"
summary: "Sovereignty is the ability to know where your data lives, who can reach it, which laws apply, and how you leave. Wombat makes those questions scoreable."
intro: "Data residency is one input. Real sovereignty also depends on identity boundaries, key ownership, supplier concentration, portability and evidence. The Sovereign pillar turns those into controls a team can assess and improve."

principles:
  - title: "Know where the data lives"
    text: "Residency is a starting point, not the whole answer. Map storage, backups, logs and derived data to jurisdictions — including the providers behind the provider."
  - title: "Know who can reach it"
    text: "Administrative access, support access, key custody and identity federation determine who can act on the data, regardless of where the rack sits."
  - title: "Know how to leave"
    text: "Portability, exit assistance, data export and contractual termination are part of sovereignty. If you cannot leave, you do not control the dependency."
  - title: "Prove it"
    text: "Sovereignty claims need evidence: control results, configuration checks, audit trails and a repeatable assessment that survives procurement and audit."

signals:
  - "Data residency and jurisdiction"
  - "Encryption and key ownership"
  - "Identity and access boundaries"
  - "Exit strategy and portability"
  - "Supplier and supply-chain risk"
  - "Evidence and auditability"

pillars:
  - slug: sovereign
    why: "The dedicated pillar for residency, jurisdiction, lock-in, exit and provider dependency."
  - slug: security
    why: "Identity, segmentation and cryptography decide who can reach the data."
  - slug: operational-excellence
    why: "Exit plans, supplier oversight and evidence collection need an operating model."
  - slug: reliability
    why: "Portability and recovery only help if the workload can actually run elsewhere."

steps:
  - "Map the data flows, backups, logs and the providers behind each service."
  - "Score the Sovereign pillar together with Security and Operational Excellence."
  - "Review exit, portability and key-ownership controls before the next renewal."
  - "Export the evidence for procurement, audit and management reporting."

