# Persona hubs — /for/<persona>/
# Each entry is a landing page for a buyer or practitioner role. Keep the
# language concrete and link to existing proof, docs and tools.

personas:
  platform-teams:
    title: "For platform teams"
    kicker: "Golden paths without lock-in"
    summary: "Give product teams a paved road that is secure, observable and portable — without turning the platform team into a ticket queue."
    intro: "Platform teams are measured on adoption, reliability and cost at the same time. Wombat gives the shared baseline: one control model, one score, and CI feedback that teams can act on before review."
    pains:
      - "Every team ships infrastructure with a different security posture."
      - "Architecture review finds the expensive problems too late."
      - "Golden paths drift as soon as the provider or the org changes."
      - "Cost, reliability and security are tracked in different tools."
    outcomes:
      - "A shared control baseline across providers and environments."
      - "A scorecard that turns an architecture review into a repeatable baseline."
      - "A CI gate that gives teams feedback in the pull request, not weeks later."
      - "A portable evidence trail for audits and management reporting."
    pillars:
      - slug: security
        why: "Secure defaults and configuration checks belong in the platform, not in a review checklist."
      - slug: reliability
        why: "Recovery, backup and failure handling are part of the paved road."
      - slug: operational-excellence
        why: "Runbooks, change control and observability make the golden path operable."
      - slug: cost-optimization
        why: "Cost feedback belongs next to the infrastructure change, not in a quarterly report."
    links:
      - label: "WOMBATpass Action"
        url: "/wombatpass-action/"
      - label: "Platform golden paths use case"
        url: "/use-cases/platform-golden-paths/"
      - label: "Run the scorecard"
        url: "/wombatpass/scorecard/"
      - label: "Controls catalogue"
        url: "/controls/"
    cta:
      title: "Put the baseline in the pull request"
      text: "Start with a score, then wire the same checks into CI so the platform team reviews exceptions instead of every change."
      primary_label: "Run the scorecard"
      primary_url: "/wombatpass/scorecard/"
      secondary_label: "See the CI action"
      secondary_url: "/wombatpass-action/"

  cisos:
    title: "For CISOs and security leaders"
    kicker: "Evidence, not assurance theatre"
    summary: "Translate cloud architecture into a risk posture the board can understand, the auditor can test and the engineering team can actually change."
    intro: "Security leaders do not need another dashboard that says red. They need a defensible baseline, a clear owner for each gap and evidence that stays current between audits. Wombat connects architecture controls to the regulations and frameworks already on the risk register."
    pains:
      - "The risk register and the cloud architecture live in different languages."
      - "Audit evidence is assembled manually at the end of the cycle."
      - "Supplier and jurisdiction risk is assessed once, then goes stale."
      - "Board reporting is disconnected from the controls engineers actually run."
    outcomes:
      - "A common baseline across the 8 pillars and the mapped frameworks."
      - "Control-level evidence that can be exported for audit and procurement."
      - "A direct line from NIS2, DORA or C5 obligations to technical controls."
      - "A repeatable score that shows movement, not just a point-in-time opinion."
    pillars:
      - slug: security
        why: "The core control environment: access, segmentation, cryptography, vulnerability handling."
      - slug: sovereign
        why: "Jurisdiction, supplier concentration and exit risk belong in the risk register."
      - slug: operational-excellence
        why: "Incident response, change control and supplier oversight need evidence, not assertions."
      - slug: reliability
        why: "Business continuity and recovery are board-level resilience questions."
    links:
      - label: "Compliance hubs"
        url: "/compliance/"
      - label: "Trust center"
        url: "/trust/"
      - label: "Controls catalogue"
        url: "/controls/"
      - label: "Governance & community"
        url: "/governance-community/"
    cta:
      title: "Make the next audit a baseline, not a scramble"
      text: "Use one score across architecture, operations and suppliers, then map the gaps to the obligations on your register."
      primary_label: "Open the compliance hubs"
      primary_url: "/compliance/"
      secondary_label: "Open the trust center"
      secondary_url: "/trust/"

  finops:
    title: "For FinOps and cloud economics"
    kicker: "Unit economics, not just spend"
    summary: "Connect cost decisions to reliability, performance and sustainability — so the cheapest change is not always the one that creates the next incident."
    intro: "FinOps is most useful when it changes an engineering decision. Wombat puts cost controls next to the reliability, performance and sustainability signals that determine whether a saving is real or just deferred."
    pains:
      - "Cost dashboards show spend, not the architecture decision behind it."
      - "Rightsizing is proposed without a reliability or performance guardrail."
      - "Commitments and provider discounts hide concentration risk."
      - "Sustainability targets are disconnected from the workload owner."
    outcomes:
      - "A shared language for cost, performance and reliability trade-offs."
      - "Controls that make waste and over-provisioning visible at review time."
      - "A score that shows whether a saving improves or weakens the architecture."
      - "Evidence for showback, chargeback and supplier negotiations."
    pillars:
      - slug: cost-optimization
        why: "The dedicated pillar for waste elimination, unit economics and commitment planning."
      - slug: performance-efficiency
        why: "Right-sizing only works when utilisation and performance are measured together."
      - slug: sustainability
        why: "Carbon and energy intensity are part of the same efficiency conversation."
      - slug: reliability
        why: "A saving that reduces resilience is a future cost, not an optimisation."
    links:
      - label: "Cost Optimization pillar"
        url: "/pillars/cost-optimization/"
      - label: "Sustainability rightsizing use case"
        url: "/use-cases/sustainability-rightsizing/"
      - label: "Controls catalogue"
        url: "/controls/"
      - label: "Run the scorecard"
        url: "/wombatpass/scorecard/"
    cta:
      title: "Price the trade-off, not just the bill"
      text: "Score the workload against cost, performance and reliability, then use the gaps to prioritise the savings that do not create new risk."
      primary_label: "Run the scorecard"
      primary_url: "/wombatpass/scorecard/"
      secondary_label: "See the cost pillar"
      secondary_url: "/pillars/cost-optimization/"

  sustainability:
    title: "For sustainability and ESG teams"
    kicker: "Carbon-aware architecture"
    summary: "Make cloud efficiency and carbon reporting part of the architecture baseline, not a separate spreadsheet owned by someone else."
    intro: "Sustainability targets fail when the workload owner cannot see the trade-off. Wombat connects efficient resource use, region choice, idle elimination and reporting evidence to the same controls the engineering team already reviews."
    pains:
      - "Carbon reporting is annual, while cloud decisions are weekly."
      - "Efficiency improvements are not connected to cost or reliability outcomes."
      - "Region choice is driven by latency and price, not carbon intensity."
      - "Evidence for ESG reporting is assembled outside the engineering workflow."
    outcomes:
      - "Efficiency and carbon signals in the same baseline as cost and reliability."
      - "Controls for idle elimination, scheduling and region awareness."
      - "A repeatable evidence trail for ESG and procurement reporting."
      - "A language that connects sustainability targets to workload decisions."
    pillars:
      - slug: sustainability
        why: "The dedicated pillar for carbon measurement, efficiency, scheduling and reporting."
      - slug: performance-efficiency
        why: "Utilisation and right-sizing are the practical levers behind efficiency."
      - slug: cost-optimization
        why: "The cheapest resource is often the one that is not running."
      - slug: reliability
        why: "Efficiency changes need a reliability guardrail, not a blind cut."
    links:
      - label: "Sustainability pillar"
        url: "/pillars/sustainability/"
      - label: "Sustainability rightsizing use case"
        url: "/use-cases/sustainability-rightsizing/"
      - label: "Controls catalogue"
        url: "/controls/"
      - label: "Comparison with provider frameworks"
        url: "/comparison/"
    cta:
      title: "Put carbon into the architecture review"
      text: "Score efficiency, region choice and idle waste together, then turn the gaps into changes the workload owner can ship."
      primary_label: "Run the scorecard"
      primary_url: "/wombatpass/scorecard/"
      secondary_label: "Read the sustainability pillar"
      secondary_url: "/pillars/sustainability/"
