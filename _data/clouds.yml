# Cloud provider hubs — /cloud/<provider>/
# Provider pages are lenses on the same Wombat baseline. Do not invent
# provider-specific control IDs or certifications; link to the comparison,
# controls catalogue and quickstart instead.

provider_data_contact: "page@wombat-gov.dev"
region_data_updated: "2026-10-31"

clouds:
  aws:
    name: "AWS"
    coverage: "framework"
    control_count: 94
    kicker: "Well-Architected, extended"
    summary: "Use AWS Well-Architected as the provider-native lens, then add the cross-provider sovereignty, evidence and cost controls that a multi-cloud estate needs."
    intro: "AWS gives teams a strong opinionated framework. Wombat does not replace it. It adds a provider-neutral baseline so the same workload can be assessed consistently when it also touches Azure, GCP, STACKIT, OVHcloud or Hetzner Cloud."
    notes:
      - "Wombat's multi-provider Terraform coverage includes AWS alongside Azure, GCP, STACKIT, OVHcloud and Hetzner Cloud (framework v1.1.0)."
      - "Use the comparison page to see where AWS Well-Architected and Wombat overlap, and where Wombat adds sovereignty and evidence coverage."
      - "The scorecard and CI action work with the same control model you use on the other providers."
    pillars:
      - slug: security
        why: "Identity, network boundaries, encryption and vulnerability handling are the first review surface."
        why_de: "Identität, Netzwerkgrenzen, Verschlüsselung und sichere Konfiguration bleiben die technische Basis."
      - slug: cost-optimization
        why: "Commitments, waste and unit economics need a consistent baseline across accounts."
        why_de: "Commitments, Waste und Unit Economics brauchen eine konsistente Baseline."
      - slug: reliability
        why: "Multi-AZ, backup and recovery decisions should be scored, not assumed."
        why_de: "Wiederherstellung und Portabilität entscheiden, ob ein Anbieterwechsel glaubwürdig ist."
      - slug: sovereign
        why: "Region choice, key custody and exit paths matter even on a mature provider."
        why_de: "Jurisdiktion, Datenresidenz, Schlüsselverwaltung und Exit sind die zentralen Fragen für diesen Provider."
    links:
      - label: "Wombat vs. AWS Well-Architected"
        url: "/comparison/"
      - label: "Controls catalogue"
        url: "/controls/"
      - label: "WOMBATpass quickstart"
        url: "/wombatpass-install/"
      - label: "Sovereignty hub"
        url: "/sovereignty/"
    cta:
      title: "Score the AWS estate against a neutral baseline"
      text: "Keep the provider-native review, then use the Wombat score to compare the same workload across providers and over time."
      primary_label: "Run the scorecard"
      primary_url: "/wombatpass/scorecard/"
      secondary_label: "See the comparison"
      secondary_url: "/comparison/"

  azure:
    name: "Azure"
    coverage: "framework"
    control_count: 91
    kicker: "CAF and Well-Architected, plus a neutral baseline"
    summary: "Keep the Azure Cloud Adoption Framework and Well-Architected guidance, then add a provider-neutral control model for the workloads that do not live in one cloud."
    intro: "Azure teams already have a strong operating model. Wombat adds the cross-provider view: the same control IDs, scoring and evidence for Azure, AWS, GCP, STACKIT, OVHcloud and Hetzner Cloud."
