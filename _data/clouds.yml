      - "Wombat's multi-provider Terraform coverage includes Azure alongside AWS, GCP, STACKIT, OVHcloud and Hetzner Cloud (framework v1.1.0)."
      - "Use the comparison page to see where Azure CAF and Wombat overlap, and where Wombat adds sovereignty and evidence coverage."
      - "The control catalogue is designed to be read across providers, not as a replacement for Azure-native guidance."
    pillars:
      - slug: security
        why: "Entra ID boundaries, network controls, encryption and secure configuration are the core review surface."
        why_de: "Identität, Netzwerkgrenzen, Verschlüsselung und sichere Konfiguration bleiben die technische Basis."
      - slug: operational-excellence
        why: "Azure estates need change control, observability and incident evidence that survives audit."
        why_de: "Lieferantenaufsicht, Incidents und Evidenz brauchen ein Betriebsmodell."
      - slug: reliability
        why: "Zone redundancy, backup and recovery objectives should be scored against the workload."
        why_de: "Wiederherstellung und Portabilität entscheiden, ob ein Anbieterwechsel glaubwürdig ist."
      - slug: sovereign
        why: "Data residency, key custody and provider concentration are procurement questions in regulated markets."
        why_de: "Jurisdiktion, Datenresidenz, Schlüsselverwaltung und Exit sind die zentralen Fragen für diesen Provider."
    links:
