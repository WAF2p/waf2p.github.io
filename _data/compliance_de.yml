# Compliance-Hubs (Deutsch) — hochlevelige Zuordnung regulatorischer
# Anforderungen zu Wombat-Säulen und Control-Themen.
#
# Dies ist eine Orientierungshilfe, keine Rechtsberatung. Die Control-Metadaten
# des Frameworks und der offizielle Rechtstext bleiben maßgeblich.

intro: "Wombat ordnet technische Controls den Pflichten zu, an denen Teams tatsächlich gemessen werden. Diese Hubs zeigen, wo das Framework hilft, welche Säulen relevant sind und wie aus einem Score ein evidenzbasierter Remediation-Plan wird."

disclaimer: "Wombat ist ein technisches Framework, keine Rechtsberatung. Diese Seiten ordnen relevante Wombat-Säulen und Control-Themen regulatorischen Pflichten zu; sie sind keine Rechtsberatung. Prüfe die Zuordnung gegen den offiziellen Text und mit deinem Auditor."

regulations:
  nis2:
    title: "NIS2"
    kicker: "EU-Cybersicherheitsrichtlinie"
    status: "Richtlinie (EU) 2022/2555 · nationale Umsetzung läuft"
    official_label: "Offizielle NIS2-Richtlinie (EUR-Lex)"
    official_url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"
    last_reviewed: "2026-10-31"
    summary: "NIS2 hebt die Baseline für Cybersicherheits-Risikomanagement, Incident-Meldung und Lieferkettenverantwortung für wesentliche und wichtige Einrichtungen in der EU."
    intro: "Die Richtlinie ist bewusst ergebnisorientiert: Die Mitgliedstaaten setzen sie in nationales Recht um, während Artikel 21 die Risikomanagement-Maßnahmen definiert, die technische Teams belegen müssen. Wombat gibt diesen Maßnahmen eine konkrete Architektur-Baseline."
    obligations:
      - title: "Risikomanagement-Maßnahmen"
        text: "Artikel 21 verlangt angemessene technische und organisatorische Maßnahmen: Risikoanalyse, Incident-Handling, Business Continuity, Lieferkettensicherheit, sichere Entwicklung, Zugriffskontrolle und Kryptografie."
      - title: "Management-Verantwortung"
        text: "Artikel 20 macht die Geschäftsleitung für die Freigabe und Überwachung der Maßnahmen verantwortlich — die Evidenz muss also auch außerhalb des Engineering-Teams verständlich sein."
      - title: "Incident-Meldung"
        text: "Artikel 23 führt Frühwarnung, Incident-Meldung und Abschlussbericht mit definierten Fristen ein. Erkennung, Klassifizierung und Evidenz müssen vor dem Incident wiederholbar sein."
      - title: "Lieferkettensicherheit"
        text: "Artikel 21(2)(d) verlangt die Bewertung der Sicherheitspraktiken direkter Lieferanten und Dienstleister, einschließlich deren eigener Abhängigkeiten."
    pillars:
      - slug: security
        why: "Identität, Segmentierung, Schwachstellenmanagement und sichere Konfiguration bilden den Kern der Artikel-21-Maßnahmen."
      - slug: operational-excellence
        why: "Runbooks, Monitoring, Change Control und Evidenzsammlung machen Incident-Response und Reporting wiederholbar."
      - slug: reliability
        why: "Business Continuity, Backup und Recovery sind ausdrückliche Erwartungen, kein Nachgedanke."
      - slug: sovereign
        why: "Lieferanten-, Jurisdiktions- und Exit-Risiko sind Teil der Lieferkettenbewertung."
    control_themes:
      - "Risikoanalyse und Sicherheitsrichtlinie"
      - "Incident-Handling und Reporting"
      - "Business Continuity und Backup"
      - "Lieferkettensicherheit"
      - "Sichere Entwicklung und Schwachstellenbehandlung"
      - "Zugriffskontrolle und Kryptografie"
    frameworks:
      - "ISO 27001:2022"
      - "BSI C5:2020"
      - "SOC 2 Type II"
    steps:
      - "Starte die WOMBATpass-Scorecard, um eine Baseline über die relevanten Säulen zu erhalten."
      - "Prüfe die NIS2-getaggten Control-Themen im Control-Katalog und ihre Evidenzerwartungen."
      - "Überführe fehlgeschlagene Controls in einen Remediation-Plan mit Verantwortlichen, Terminen und Abnahmekriterien."
      - "Exportiere das Evidenzpaket für Management-Review und Incident-Übungen."
    cta:
      title: "Mit einer NIS2-Baseline starten"
      text: "Bewerte die aktuelle Architektur und nutze die zugeordneten Control-Themen, um einen belastbaren Remediation-Plan zu erstellen."
      primary_label: "Scorecard starten"
      primary_url: "/de/wombatpass/scorecard/"
      secondary_label: "Controls durchsuchen"
      secondary_url: "/de/controls/"

  dora:
    title: "DORA"
    kicker: "EU-Digital Operational Resilience"
    status: "Verordnung (EU) 2022/2554 · gilt seit 17. Januar 2025"
    official_label: "Offizielle DORA-Verordnung (EUR-Lex)"
    official_url: "https://eur-lex.europa.eu/eli/reg/2022/2554/oj"
    last_reviewed: "2026-10-31"
    summary: "DORA bündelt ICT-Risikomanagement, Incident-Meldung, Resilienztests und Dienstleisteraufsicht in einem Regime für die operationelle Resilienz von Finanzunternehmen und ihren kritischen Dienstleistern."
    intro: "DORA ist weniger ein einmaliges Audit als der Nachweis, dass eine Organisation ICT-Störungen widerstehen, darauf reagieren und sich davon erholen kann. Wombat verbindet die Architektur-Baseline mit der operativen und dienstleisterbezogenen Evidenz, die Aufsichtsbehörden erwarten."
    obligations:
      - title: "ICT-Risikomanagement"
        text: "Ein dokumentiertes, governantes Framework zur Identifikation, zum Schutz vor, zur Erkennung, Reaktion auf und Wiederherstellung von ICT-Risiken."
      - title: "Incident-Management und Reporting"
        text: "Klassifizierung, Frühwarnung, Meldung und Abschlussbericht innerhalb definierter Fristen, mit Evidenz für die Reaktion."
      - title: "Digital Operational Resilience Testing"
        text: "Regelmäßige Tests kritischer Systeme und Wiederherstellungsfähigkeiten, angemessen zum Risikoprofil der Einrichtung."
      - title: "ICT-Drittanbieterrisiko"
        text: "Vertragliche, Konzentrations-, Exit- und Aufsichtsanforderungen für kritische ICT-Dienstleister — einschließlich der Fähigkeit, den Anbieter zu wechseln."
    pillars:
      - slug: operational-excellence
        why: "DORA ist eine Operating-Model-Verordnung: Runbooks, Change Control, Monitoring und Evidenz stehen im Zentrum."
      - slug: reliability
        why: "Recovery-Ziele, Backup, Failover und Continuity-Tests sind direkt für Resilienztests relevant."
      - slug: security
        why: "Zugriffskontrolle, Schwachstellenbehandlung und sichere Konfiguration tragen das ICT-Risikoframework."
      - slug: sovereign
        why: "Drittanbieter-Konzentration, Jurisdiktion und Exit-Strategie gehören zur Dienstleisteraufsicht."
    control_themes:
      - "ICT-Risikomanagement und Governance"
      - "Incident-Klassifizierung und Reporting"
      - "Resilienz- und Recovery-Tests"
      - "ICT-Drittanbieter- und Konzentrationsrisiko"
      - "Business Continuity und Backup"
      - "Zugriffskontrolle und Kryptografie"
    frameworks:
      - "ISO 27001:2022"
      - "SOC 2 Type II"
      - "BSI C5:2020"
    steps:
      - "Bewerte die Operational-Resilience-Baseline über Operations, Reliability und Security."
      - "Prüfe Drittanbieter-, Exit- und Konzentrations-Controls vor der nächsten Vertragsverlängerung."
      - "Nutze fehlgeschlagene Controls, um Resilienztests und Recovery-Abnahmekriterien zu definieren."
      - "Exportiere die Evidenz für das ICT-Risikoregister und das Management-Reporting."
    cta:
      title: "Resilienz-Evidenz wiederholbar machen"
      text: "Starte die Scorecard und bringe dieselben Prüfungen in die CI, damit die Evidenz zwischen Audits aktuell bleibt."
      primary_label: "Scorecard starten"
      primary_url: "/de/wombatpass/scorecard/"
      secondary_label: "CI-Gate hinzufügen"
      secondary_url: "/de/wombatpass-action/"

  c5:
    title: "BSI C5"
    kicker: "Deutscher Cloud-Compliance-Katalog"
    status: "BSI C5:2020 · Cloud-Provider-Attestierung"
    official_label: "Offizielle BSI-C5-Seite"
    official_url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/Kriterienkatalog-C5/C5_AktuelleVersion/C5_AktuelleVersion.html"
    last_reviewed: "2026-10-31"
    summary: "Der BSI Cloud Computing Compliance Criteria Catalogue (C5) ist der deutsche Benchmark für Cloud-Sicherheit, Transparenz und Auditierbarkeit — und eine häufige Beschaffungsanforderung für Cloud-Provider und ihre Kunden."
    intro: "C5 ist um auditierbare Kriterien strukturiert: Sicherheit, Verfügbarkeit, Vertraulichkeit, Integrität, Transparenz und Compliance. Wombat hilft Teams, diese Kriterien in konkrete Architekturprüfungen und wiederverwendbare Evidenz zu übersetzen."
    obligations:
      - title: "Sicherheit und Verfügbarkeit"
        text: "C5 erwartet dokumentiertes Sicherheitsmanagement, Zugriffskontrolle, Kryptografie, Monitoring und Verfügbarkeitsmaßnahmen für Cloud-Dienste."
      - title: "Vertraulichkeit und Integrität"
        text: "Datenklassifizierung, Mandantentrennung, Verschlüsselung und Integritätsschutz werden über den Service-Lebenszyklus bewertet."
      - title: "Transparenz und Auditierbarkeit"
        text: "Provider müssen relevante Sicherheitsinformationen für Kunden und Auditoren bereitstellen; Evidenz muss nachvollziehbar sein."
      - title: "Lieferkette und Betrieb"
        text: "Incident-Management, Change-Management, Lieferantenaufsicht und Business Continuity sind Teil des auditierten Kontrollumfelds."
    pillars:
      - slug: security
        why: "Die Kernkriterien von C5 sind Sicherheits-Controls: Zugriff, Kryptografie, Logging, Schwachstellenbehandlung und sichere Konfiguration."
      - slug: sovereign
        why: "Datenresidenz, Jurisdiktion, Provider-Abhängigkeit und Exit-Pfade sind zentral für die deutsche Cloud-Beschaffung."
      - slug: operational-excellence
        why: "C5 ist evidenzintensiv: Change Control, Incidents, Monitoring und Lieferantenaufsicht brauchen ein wiederholbares Betriebsmodell."
      - slug: reliability
        why: "Verfügbarkeits-, Backup- und Recovery-Kriterien müssen entworfen und nachgewiesen werden, nicht angenommen."
    control_themes:
      - "Zugriffskontrolle und Identität"
      - "Kryptografie und Schlüsselverwaltung"
      - "Logging, Monitoring und Incident-Management"
      - "Lieferkette und Provider-Aufsicht"
      - "Datenresidenz und Transparenz"
      - "Business Continuity und Verfügbarkeit"
    frameworks:
      - "ISO 27001:2022"
      - "SOC 2 Type II"
      - "DSGVO"
    steps:
      - "Definiere den Service-Scope und die C5-Kriterien, die für Beschaffung oder Attestierung gelten."
      - "Bewerte die aktuelle Architektur gegen die relevanten Säulen."
      - "Prüfe die C5-getaggten Control-Themen und sammle Evidenz pro Kriterium."
      - "Exportiere das Evidenzpaket für Auditor, Kunden oder internes Risikokomitee."
    cta:
      title: "Eine C5-Evidenz-Baseline vorbereiten"
      text: "Nutze die Scorecard, um Lücken zu finden, und den Control-Katalog, um die Evidenz vor dem Auditfenster zusammenzustellen."
      primary_label: "Scorecard starten"
      primary_url: "/de/wombatpass/scorecard/"
      secondary_label: "Trust Center öffnen"
      secondary_url: "/de/trust/"

  c3a:
    title: "BSI C3A"
    kicker: "Cloud-Souveränitätskriterien"
    status: "BSI C3A:2026 · Criteria enabling Cloud Computing Autonomy · veröffentlicht am 27. April 2026"
    official_label: "Offizielle C3A-Veröffentlichung (BSI)"
    official_url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Informationen-und-Empfehlungen/Empfehlungen-nach-Angriffszielen/Cloud-Computing/C3A/C3A.html"
    last_reviewed: "2026-10-31"
    summary: "C3A ist der unverbindliche Kriterienkatalog des BSI für digitale Souveränität bei Cloud-Diensten. Er ist in sechs Souveränitätskategorien gegliedert: strategisch, rechtlich und jurisdiktional, Daten, Betrieb, Lieferkette und Technologie."
    intro: "C3A wurde am 27. April 2026 vom BSI veröffentlicht. Der Katalog schafft Transparenz für digital souveräne Cloud-Nutzung, basiert auf dem EU Cloud Sovereignty Framework (EU CSF) und setzt die Einhaltung von C5 voraus. Das Dashboard ordnet derzeit WAF-SOV-010 (Datenresidenz & Geolokation) und WAF-SOV-020 (Verschlüsselungs-Schlüsselverwaltung) den C3A-Daten- und Jurisdiktionsdimensionen zu; nutze das als Ausgangspunkt und prüfe die exakten Kriterien im offiziellen Katalog."
    obligations:
      - title: "Strategische Souveränität (SOV-1)"
        text: "Strategie, Governance und Entscheidungsprozesse des Providers müssen souveräne Cloud-Nutzung unterstützen und für Kunden transparent sein."
      - title: "Rechtliche und jurisdiktionale Souveränität (SOV-2)"
        text: "Jurisdiktion, Eigentum, rechtliche Exposition und die Fähigkeit, extraterritorialen Zugriffsersuchen zu widerstehen, müssen bewertbar sein."
      - title: "Datensouveränität (SOV-3)"
        text: "Datenklassifizierung, Residenz, Verarbeitungsorte, Verschlüsselung und Schlüsselverwaltung bestimmen, wer unter welchem Recht auf die Daten zugreifen kann."
      - title: "Betriebliche, Lieferketten- und Technologiesouveränität (SOV-4–SOV-6)"
        text: "Betriebliche Unabhängigkeit, Lieferantenabhängigkeiten, SBOM-/Hardware-Transparenz, Source-Code-Escrow und Exit-Fähigkeit gehören zum Souveränitätsbild."
    pillars:
      - slug: sovereign
        why: "Die primäre Zuordnung: WAF-SOV-010 und WAF-SOV-020 sind für die Daten-, Jurisdiktions- und Technologiesouveränität relevant."
      - slug: security
        why: "Verschlüsselung, Schlüsselverwahrung und Zugriffsgrenzen sind der technische Kern der Daten- und Technologiekategorien."
      - slug: operational-excellence
        why: "Evidenz, Lieferantenaufsicht und Change Control machen die Souveränitätsaussagen auditierbar."
      - slug: reliability
        why: "Ein Jurisdiktionswechsel oder Provider-Exit ist nur glaubwürdig, wenn der Workload wiederhergestellt und verschoben werden kann."
    control_themes:
      - "Strategische Souveränität"
      - "Rechtliche und jurisdiktionale Souveränität"
      - "Datensouveränität und Residenz"
      - "Betriebliche Souveränität"
      - "Lieferketten-Souveränität"
      - "Technologie-Souveränität"
      - "Verschlüsselung und Schlüsselverwaltung"
      - "Evidenz und Auditierbarkeit"
    frameworks:
      - "BSI C5"
      - "EU Cloud Sovereignty Framework (EU CSF)"
      - "ISO 27001:2022"
    steps:
      - "Bestätige den C3A-Scope und die sechs Souveränitätskategorien in der offiziellen BSI-Veröffentlichung."
      - "Prüfe die aktuelle WAF-SOV-010/020-Zuordnung im Dashboard als Ausgangspunkt und verifiziere die exakten C3A-Kriterien."
      - "Bewerte die Sovereign-Säule und sammle Residenz-, Jurisdiktions- und Schlüssel-Evidenz."
      - "Exportiere die Evidenz für Provider-, Beschaffungs- oder Audit-Gespräche."
    cta:
      title: "Die C3A-Souveränitätsaussage belegbar machen"
      text: "Bewerte die Sovereign-Baseline und verbinde die offiziellen C3A-Kategorien mit den Controls und der Evidenz, die du tatsächlich liefern kannst."
      primary_label: "Scorecard starten"
      primary_url: "/de/wombatpass/scorecard/"
      secondary_label: "Souveränitäts-Hub öffnen"
      secondary_url: "/de/sovereignty/"
