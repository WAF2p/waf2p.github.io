# Souveränitäts-Hub (Deutsch). Technische und organisatorische Einordnung;
# keine Rechtsberatung.

title: "Souveränität"
kicker: "Kontrolle, nicht nur Standort"
summary: "Souveränität bedeutet zu wissen, wo Daten liegen, wer darauf zugreifen kann, welches Recht gilt und wie man den Anbieter wieder verlässt. Wombat macht diese Fragen bewertbar."
intro: "Datenresidenz ist ein Input. Echte Souveränität hängt auch von Identitätsgrenzen, Schlüsselverwahrung, Lieferantenkonzentration, Portabilität und Evidenz ab. Die Sovereign-Säule übersetzt diese Fragen in Controls, die ein Team bewerten und verbessern kann."

principles:
  - title: "Wissen, wo die Daten liegen"
    text: "Residenz ist ein Anfang, nicht die ganze Antwort. Ordne Speicher, Backups, Logs und abgeleitete Daten Jurisdiktionen zu — einschließlich der Provider hinter dem Provider."
  - title: "Wissen, wer darauf zugreifen kann"
    text: "Administrativer Zugriff, Support-Zugriff, Schlüsselverwahrung und Identitätsföderation bestimmen, wer auf die Daten einwirken kann, unabhängig davon, wo das Rack steht."
  - title: "Wissen, wie man wieder herauskommt"
    text: "Portabilität, Exit-Unterstützung, Datenexport und Vertragsbeendigung gehören zur Souveränität. Wer nicht wechseln kann, kontrolliert die Abhängigkeit nicht."
  - title: "Es belegen können"
    text: "Souveränitätsaussagen brauchen Evidenz: Control-Ergebnisse, Konfigurationsprüfungen, Audit-Trails und eine wiederholbare Bewertung, die Beschaffung und Audit bestehen."

signals:
  - "Datenresidenz und Jurisdiktion"
  - "Verschlüsselung und Schlüsselverwahrung"
  - "Identitäts- und Zugriffsgrenzen"
  - "Exit-Strategie und Portabilität"
  - "Lieferanten- und Lieferkettenrisiko"
  - "Evidenz und Auditierbarkeit"

pillars:
  - slug: sovereign
    why: "Die dedizierte Säule für Residenz, Jurisdiktion, Lock-in, Exit und Provider-Abhängigkeit."
  - slug: security
    why: "Identität, Segmentierung und Kryptografie entscheiden, wer auf die Daten zugreifen kann."
  - slug: operational-excellence
    why: "Exit-Pläne, Lieferantenaufsicht und Evidenzsammlung brauchen ein Betriebsmodell."
  - slug: reliability
    why: "Portabilität und Recovery helfen nur, wenn der Workload tatsächlich woanders laufen kann."

steps:
  - "Ordne Datenflüsse, Backups, Logs und die Provider hinter jedem Service zu."
  - "Bewerte die Sovereign-Säule zusammen mit Security und Operational Excellence."
  - "Prüfe Exit-, Portabilitäts- und Schlüsselverwahrungs-Controls vor der nächsten Vertragsverlängerung."
  - "Exportiere die Evidenz für Beschaffung, Audit und Management-Reporting."

