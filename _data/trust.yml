# Trust center — /trust/
# A public summary of the project's licenses, security process, governance,
# data handling and release transparency. This is a summary of public
# commitments, not a certification.

last_reviewed: "2026-10-31"
intro: "Wombat is an open-source framework with a public governance process. This page collects the facts a security reviewer, procurement team or partner usually asks for — and tells you where to verify each one."
disclaimer: "This page is a summary of public commitments. It is not a certification, an audit opinion or a legal opinion. The authoritative sources are the repository files, the licenses and the official project documentation."

sections:
  - title: "Open source, clear licenses"
    summary: "The code and the documentation use standard open licenses, with the repository files as the authoritative source."
    facts:
      - "Code: Apache License 2.0"
      - "Documentation: CC BY 4.0"
      - "Authoritative files: LICENSE / NOTICE in the repository and the notes on /legal/"
    links:
      - label: "Legal notices"
        url: "/legal/"
      - label: "Framework repository"
        url: "https://github.com/waf2p/framework"

  - title: "Security and responsible disclosure"
    summary: "Security issues are reported privately and published in a coordinated way. Do not open a public issue for a vulnerability."
    facts:
      - "The framework repository contains a SECURITY.md policy."
      - "Use GitHub's private vulnerability reporting / security advisory flow."
      - "Coordinated disclosure is the default; no bug bounty is implied."
    links:
      - label: "Security policy"
        url: "https://github.com/waf2p/framework/security/policy"
      - label: "Report a vulnerability"
        url: "https://github.com/waf2p/framework/security/advisories/new"
      - label: "security.txt"
        url: "/.well-known/security.txt"

  - title: "Governance and decisions"
    summary: "Significant changes go through a public RFC process. Roles, terms and decision rules are documented rather than implied."
    facts:
      - "RFC-driven decisions with public discussion"
      - "TSC, working groups and contributor roles"
      - "Code of Conduct applies to all project spaces"
    links:
      - label: "Governance & community"
        url: "/governance-community/"
      - label: "RFC tracker"
        url: "/rfc/"
      - label: "Code of Conduct"
        url: "/code-of-conduct/"
      - label: "Roles & members"
        url: "/roles/"

  - title: "Data handling on this website"
    summary: "The marketing site is static. The scorecard runs in your browser. We do not upload your assessment to a Wombat server."
    facts:
      - "No server-side database stores assessment results."
      - "The scorecard reads your JSON locally and renders the card in the browser."
      - "Newsletter signup is handled by the configured email provider, not by a Wombat application server."
      - "The rank system publishes only a public GitHub login and the computed rank."
    links:
      - label: "Scorecard"
        url: "/wombatpass/scorecard/"
      - label: "Contributor ranks"
        url: "/contributors/ranks/"
      - label: "Newsletter"
        url: "/newsletter/"

  - title: "Release transparency"
    summary: "Releases, changes and the roadmap are public. Documentation is versioned alongside the framework."
    facts:
      - "Public changelog with versioned entries"
      - "Public roadmap and RFC tracker"
      - "Versioned Antora documentation"
    links:
      - label: "Changelog"
        url: "/changelog/"
      - label: "Roadmap"
        url: "/roadmap/"
      - label: "Documentation"
        url: "/docs/"

  - title: "Contributing and conduct"
    summary: "Contribution rules, review expectations and community conduct are documented in the repository and on the site."
    facts:
      - "CONTRIBUTING.md in the framework repository"
      - "CODE_OF_CONDUCT.md in the framework repository"
      - "Good first issues and public discussions"
    links:
      - label: "Contributing"
        url: "/contributing/"
      - label: "Good first issues"
        url: "https://github.com/waf2p/framework/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22"
      - label: "Discussions"
        url: "https://github.com/waf2p/framework/discussions"

verification:
  title: "How to verify the claims on this page"
  text: "Every item above links to a public source. If a claim cannot be verified from the repository, the licenses or the public documentation, treat it as a question for the maintainers — not as a commitment."
  checklist:
    - "Read LICENSE, NOTICE and SECURITY.md in the framework repository."
    - "Check the RFC tracker and the governance page for decision history."
    - "Read the versioned documentation for the controls and their evidence expectations."
    - "Use the public issue tracker or discussions for anything that is not documented."

cta:
  title: "Need a security or procurement conversation?"
  text: "Start with the public sources, then bring the specific question to the community. The governance page explains the channels."
  primary_label: "Governance & community"
  primary_url: "/governance-community/"
  secondary_label: "Open the compliance hubs"
  secondary_url: "/compliance/"
